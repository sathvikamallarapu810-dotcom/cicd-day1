apiVersion: apps/v1
kind: Deployment
metadata:
  name: day5-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: day5-app
  template:
    metadata:
      labels:
        app: day5-app
    spec:
      containers:
        - name: cicd-day4-app
          image: sathvika1203/cicd-day4-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: day5-service
spec:
  type: NodePort
  selector:
    app: day5-app
  ports:
    - port: 80
      targetPort: 80