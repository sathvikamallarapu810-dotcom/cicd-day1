name: Day 4 CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Starting build..."
          test -f app.txt
          test -f app-build.txt
          echo "Build successful!"

      - name: Test
        run: |
          echo "Running tests..."
          test -f test.txt
          grep "CI/CD Test Passed" test.txt
          echo "All tests passed!"

      - name: Build Docker image
        run: |
          docker build -t sathv16/cicd-day4-app:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push sathv16/cicd-day4-app:latest